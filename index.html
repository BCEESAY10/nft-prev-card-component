<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png"> 
  <title>Frontend Mentor | NFT preview card component</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <img class="rounded" src="images/image-equilibrium.jpg" alt="Main image">
      <div class="active-overlay rounded"><img class="text-white" width="32px" height="32px" src="images/icon-view.svg" alt="eye icon"></div>
    </header>
    <section class="content">
      <h1 class="heading">Equilibrium #3429</h1>
      <p>Our Equilibrium collection promotes balance and calm.</p>
      <article>
        <p class="text-cyan">0.041 ETH</p>
        <p>3 days left</p>
      </article>
    </section>
    <hr class="divider">
    <footer>
      <img width="32" height="32" src="images/image-avatar.png" alt="Profile image">
      <p>Creation of <span class="text-white">Jules Wyvern</span></p>
    </footer>
  </main>

</body>
</html>
